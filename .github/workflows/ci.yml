name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: shellcheck -S warning install.sh hooks/*.sh scripts/*
      - name: Install smoke test (clean CLAUDE_HOME)
        run: |
          export CLAUDE_HOME="$(mktemp -d)"
          ./install.sh
          test -f "$CLAUDE_HOME/skills/z/SKILL.md"
          ! grep -rl 'CLAUDE_PLUGIN_ROOT' "$CLAUDE_HOME"/skills "$CLAUDE_HOME"/agents "$CLAUDE_HOME"/team-templates
      - name: Plugin files are valid JSON
        run: jq -e . .claude-plugin/plugin.json .claude-plugin/marketplace.json hooks/hooks.json
      - name: Skills are self-consistent (check-skills, doctor runs)
        run: |
          export CLAUDE_HOME="$(mktemp -d)"
          ./install.sh
          bash scripts/check-skills.sh
          CLAUDE_HOME="$CLAUDE_HOME" bash scripts/doctor.sh
